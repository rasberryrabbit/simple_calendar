<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캘린더 백업 뷰어</title>
<style>
:root{--bg:#faf9fc;--card:#fff;--ink:#26233a;--mute:#8a869b;--line:#e3e0ec;--head:#ddd4ea;--accent:#5b3fa0;
--sat:#2f6fd0;--sun:#d9484f;--off:#e2e1e6;--plan:#d8ecd8;--show:#fff0c8;--etc:#dbe8fb;--dim:#f1f0f5;--base:#e8f0fb}
@media (prefers-color-scheme:dark){:root{--bg:#17151f;--card:#201e2b;--ink:#ece9f6;--mute:#9591a8;--line:#363349;--head:#3a3158;--accent:#b9a3f0;--sat:#7fa8f0;--sun:#f08a90;--off:#383643;--plan:#2f4a33;--show:#54492a;--etc:#2c3f5c;--dim:#1a1824;--base:#243049}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Pretendard","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--head);border-radius:12px;padding:10px 14px;margin-bottom:10px}
header h1{flex:1;min-width:120px;margin:0;font-size:20px;color:var(--accent);text-align:center}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.owner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 2px 8px;font-size:13px;color:var(--mute)}
.owner b{color:var(--ink);font-size:15px}
.owner label{cursor:pointer;margin-left:auto}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:644px}
.dow{padding:7px 0;text-align:center;font-weight:600;background:var(--dim);border-bottom:1px solid var(--line)}
.dow.sat,.n.sat{color:var(--sat)}.dow.sun,.n.sun{color:var(--sun)}
.cell{min-height:104px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--dim);cursor:default;opacity:.55}
.cell:not(.out):hover{background:var(--dim)}
.n{font-weight:700;font-size:13px}
.today .n{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px;align-self:flex-start}
.cell.hasbase{background:var(--base)}
.base{font-size:11px;line-height:1.3;color:var(--mute);text-align:left;word-break:keep-all;overflow-wrap:anywhere}
.cell.rest,.cell.rest:hover{background:repeating-linear-gradient(135deg,var(--off) 0 8px,transparent 8px 16px),var(--off)}
.cell.rest .ev{background:transparent;font-weight:700}
.ev{border-radius:6px;padding:4px 6px;font-size:12.5px;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.ev.off{background:var(--off)}.ev.plan{background:var(--plan)}.ev.show{background:var(--show)}.ev.etc{background:var(--etc)}
.status{margin:8px 2px;color:var(--mute);font-size:12px}
.sub{font-size:12px;color:var(--mute);margin:10px 0 6px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mute);margin-bottom:10px}
body.dragging .drop{border-color:var(--accent);color:var(--accent)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.box h2{margin:0 0 6px;font-size:17px}
.item{padding:6px 2px;border-bottom:1px solid var(--line)}
.acts{display:flex;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="prev" aria-label="이전 달">‹</button>
    <h1 id="title"></h1>
    <button id="next" aria-label="다음 달">›</button>
    <select id="msel" title="데이터가 있는 월로 이동" style="display:none"></select>
    <button id="today">오늘</button>
    <button id="open" class="pri">백업 파일 열기</button>
    <input type="file" id="fi" accept=".json,application/json" multiple hidden>
  </header>
  <div class="drop" id="drop">백업 JSON 파일(<code>calendar-backup-*.json</code>, <code>calendar-expired-*.json</code>)을 여기로 끌어다 놓거나 위의 <b>백업 파일 열기</b>를 눌러 주세요. 여러 파일을 한꺼번에 열면 합쳐서 보여요. 파일은 이 컴퓨터 안에서만 읽고 어디로도 전송하지 않아요.</div>
  <div class="owner"><span id="info"></span><button id="reset" style="display:none">비우기</button><label id="bwrap"><input type="checkbox" id="sbase" checked> 출시일 표시</label></div>
  <div class="scroll"><div class="grid" id="grid"></div></div>
  <div class="status" id="status"></div>
</div>
<div class="modal" id="modal"><div class="box">
  <h2 id="mtitle"></h2>
  <div id="bsec"></div>
  <div id="psec"></div>
  <div class="acts"><button id="close">닫기</button></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const DOW=["월","화","수","목","금","토","일"];
const BICON={game:"🎮",event:"🎉",gear:"🖥️"};
const kind=(t,c)=>/휴식|휴방/.test(t)?"off":(c==="off"||c==="show"?"plan":(c||"plan"));
const now=new Date();
let y=now.getFullYear(),m=now.getMonth(),mine={},base={},files=[],names=[],showBase=true;
const mkey=()=>y+"-"+pad(m+1);
const dkey=d=>mkey()+"-"+pad(d);

function merge(t,ev){
  for(const [d,list] of Object.entries(ev||{})){
    if(!Array.isArray(list))continue;
    const a=t[d]||(t[d]=[]);
    list.forEach(x=>{
      if(!x||typeof x.t!=="string")return;
      if(!a.some(z=>(z.id&&z.id===x.id)||(!x.id&&z.t===x.t&&z.c===x.c)))a.push(x);
    });
  }
}
function ingest(obj){
  let n=0;
  if(obj&&obj.months)for(const v of Object.values(obj.months)){merge(mine,v&&v.events);n++}
  if(obj&&obj.base)for(const v of Object.values(obj.base)){merge(base,v&&v.events);n++}
  if(obj&&Array.isArray(obj.expired))obj.expired.forEach(x=>{if(!x)return;merge(x.kind==="base"?base:mine,x.events);n++});
  if(obj&&obj.name&&!names.includes(obj.name))names.push(obj.name);
  return n;
}
async function loadFiles(list){
  const errs=[];
  for(const f of list){
    try{
      const obj=JSON.parse(await f.text());
      if(!ingest(obj))throw new Error("일정 데이터가 없어요");
      files.push(f.name);
    }catch(e){errs.push(f.name+": "+(e.message||"읽을 수 없어요"))}
  }
  const ms=monthsWithData();
  if(ms.length){const last=ms[ms.length-1];y=+last.slice(0,4);m=+last.slice(5)-1}
  refresh();
  $("status").textContent=errs.length?"열지 못한 파일 — "+errs.join(" / "):"";
}
function monthsWithData(){
  const s=new Set();
  [mine,base].forEach(t=>Object.keys(t).forEach(d=>{if(t[d].length&&/^\d{4}-\d{2}-\d{2}$/.test(d))s.add(d.slice(0,7))}));
  return [...s].sort();
}
function count(t){return Object.values(t).reduce((a,l)=>a+l.length,0)}
function refresh(){
  const ms=monthsWithData(),sel=$("msel");
  sel.innerHTML="";
  ms.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k.slice(0,4)+"년 "+(+k.slice(5))+"월";sel.appendChild(o)});
  sel.style.display=ms.length?"":"none";
  $("reset").style.display=files.length?"":"none";
  $("drop").style.display=files.length?"none":"";
  $("info").innerHTML=files.length
    ?"<b>"+(names.length?names.join(", ")+"님의 캘린더":"백업 캘린더")+"</b> · 파일 "+files.length+"개 · 개인 일정 "+count(mine)+"건 · 출시 일정 "+count(base)+"건 · 읽기 전용"
    :"불러온 백업이 없어요.";
  render();
}
function render(){
  $("title").textContent=y+"년 "+(m+1)+"월";
  const k=mkey(),sel=$("msel");
  if([...sel.options].some(o=>o.value===k))sel.value=k;else sel.selectedIndex=-1;
  const g=$("grid");g.innerHTML="";
  DOW.forEach((d,i)=>{const e=document.createElement("div");e.className="dow"+(i==5?" sat":i==6?" sun":"");e.textContent=d;g.appendChild(e)});
  const off=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
  const rows=Math.ceil((off+days)/7),t=new Date();
  for(let i=0;i<rows*7;i++){
    const c=document.createElement("div"),col=i%7,d=i-off+1;
    const n=document.createElement("div");n.className="n"+(col==5?" sat":col==6?" sun":"");
    if(d<1||d>days){c.className="cell out";n.textContent=d<1?prevDays+d:d-days;c.appendChild(n)}
    else{
      c.className="cell"+(t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d?" today":"");
      n.textContent=d;c.appendChild(n);
      const bl=showBase?(base[dkey(d)]||[]):[];
      if(bl.length){
        c.classList.add("hasbase");
        bl.forEach(x=>{const b=document.createElement("div");b.className="base";b.textContent=(BICON[x.c]||"")+" "+x.t;c.appendChild(b)});
      }
      (mine[dkey(d)]||[]).forEach(ev=>{
        const e=document.createElement("div"),kd=kind(ev.t,ev.c);
        e.className="ev "+kd;e.textContent=ev.t;
        if(kd==="off")c.classList.add("rest");
        c.appendChild(e);
      });
      c.onclick=()=>openDay(d);
    }
    g.appendChild(c);
  }
}
function openDay(d){
  $("mtitle").textContent=y+"년 "+(m+1)+"월 "+d+"일";
  const fill=(box,title,list,icon)=>{
    box.innerHTML="";
    if(!list.length)return;
    const h=document.createElement("div");h.className="sub";h.textContent=title;box.appendChild(h);
    list.forEach(x=>{const r=document.createElement("div");r.className="item";r.textContent=(icon?(BICON[x.c]||"")+" ":"")+x.t;box.appendChild(r)});
  };
  const b=base[dkey(d)]||[],p=mine[dkey(d)]||[];
  fill($("bsec"),"출시 일정",b,true);
  fill($("psec"),"내 일정",p,false);
  if(!b.length&&!p.length){$("psec").innerHTML='<div class="sub">이 날은 일정이 없어요.</div>'}
  $("modal").classList.add("on");
}
function go(dm){m+=dm;if(m<0){m=11;y--}if(m>11){m=0;y++}render()}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("today").onclick=()=>{y=now.getFullYear();m=now.getMonth();render()};
$("msel").onchange=()=>{const k=$("msel").value;y=+k.slice(0,4);m=+k.slice(5)-1;render()};
$("open").onclick=()=>$("fi").click();
$("fi").onchange=async e=>{await loadFiles([...e.target.files]);e.target.value=""};
$("reset").onclick=()=>{mine={};base={};files=[];names=[];$("status").textContent="";refresh()};
$("sbase").onchange=()=>{showBase=$("sbase").checked;render()};
$("close").onclick=()=>$("modal").classList.remove("on");
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("on")};
addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("dragging")});
addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("dragging")});
addEventListener("drop",async e=>{e.preventDefault();document.body.classList.remove("dragging");await loadFiles([...e.dataTransfer.files])});
refresh();
</script>
</body>
</html>
