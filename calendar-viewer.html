<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
(function(){
  var d=document.documentElement;d.dataset.wide="1";
  var DEF={bg:"#faf9fc",card:"#ffffff",ink:"#26233a",head:"#ddd4ea",accent:"#5b3fa0",plan:"#d8ecd8",off:"#e2e1e6",base:"#e8f0fb",sat:"#2f6fd0",sun:"#d9484f"};
  var FIELDS=[["bg","배경"],["card","칸 배경"],["ink","글자"],["head","상단 바"],["accent","강조색"],["plan","일정 칩"],["off","휴식 칸"],["base","출시일 배경"],["sat","토요일"],["sun","일요일"]];
  function isHex(v){return /^#[0-9a-f]{6}$/i.test(v)}
  function rgb(h){return [1,3,5].map(function(i){return parseInt(h.slice(i,i+2),16)})}
  function toHex(a){return "#"+a.map(function(x){return Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,"0")}).join("")}
  function mix(a,b,t){var A=rgb(a),B=rgb(b);return toHex(A.map(function(x,i){return x*(1-t)+B[i]*t}))}
  function lum(h){var c=rgb(h).map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
  function contrast(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05)}
  function load(){var o={};try{o=JSON.parse(localStorage.getItem("customTheme")||"{}")||{}}catch(e){}var c={};for(var k in DEF)c[k]=isHex(o[k])?o[k].toLowerCase():DEF[k];return c}
  function save(c){try{localStorage.setItem("customTheme",JSON.stringify(c))}catch(e){}}
  function css(c){var v={};for(var k in c)v[k]=c[k];v.mute=mix(c.ink,c.bg,.4);v.line=mix(c.ink,c.bg,.82);v.dim=mix(c.bg,c.ink,.05);v.etc=mix(c.plan,c.sat,.35);v.show=mix(c.plan,"#ffd54f",.55);v.onaccent=lum(c.accent)>.4?"#000000":"#ffffff";var s="";for(var n in v)s+="--"+n+":"+v[n]+";";return 'html:root[data-pal="custom"]{'+s+'}'}
  function apply(c){var st=document.getElementById("customStyle");if(!st){st=document.createElement("style");st.id="customStyle";document.head.appendChild(st)}st.textContent=css(c)}
  window.CT={DEF:DEF,FIELDS:FIELDS,load:load,save:save,apply:apply,contrast:contrast,isHex:isHex};
  try{var p=localStorage.getItem("pal");if(p)d.dataset.pal=p;if(localStorage.getItem("wide")==="0")delete d.dataset.wide;if(p==="custom")apply(load())}catch(e){}
})();
</script>

<title>캘린더 백업 뷰어</title>
<style>
:root{--bg:#faf9fc;--card:#fff;--ink:#26233a;--mute:#8a869b;--line:#e3e0ec;--head:#ddd4ea;--accent:#5b3fa0;
--sat:#2f6fd0;--sun:#d9484f;--off:#e2e1e6;--plan:#d8ecd8;--show:#fff0c8;--etc:#dbe8fb;--dim:#f1f0f5;--base:#e8f0fb;--onaccent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#17151f;--card:#201e2b;--ink:#ece9f6;--mute:#9591a8;--line:#363349;--head:#3a3158;--accent:#b9a3f0;--sat:#7fa8f0;--sun:#f08a90;--off:#383643;--plan:#2f4a33;--show:#54492a;--etc:#2c3f5c;--dim:#1a1824;--base:#243049;--onaccent:#1a1030}}
:root[data-pal="ocean"]{--bg:#f3f8fb;--card:#ffffff;--ink:#10303f;--mute:#56707f;--line:#cfe0ea;--head:#cfe8f3;--accent:#0b5f8a;--onaccent:#ffffff;--sat:#1565c0;--sun:#c62828;--off:#dfe5e9;--plan:#d4efe3;--show:#fdeec2;--etc:#d6e6f7;--dim:#eaf2f7;--base:#e1f1fa}
:root[data-pal="forest"]{--bg:#f4f8f3;--card:#ffffff;--ink:#1b2e1f;--mute:#5a705f;--line:#d3e1d1;--head:#d6ead3;--accent:#2e6b34;--onaccent:#ffffff;--sat:#1d6fb8;--sun:#c0392b;--off:#e2e6df;--plan:#cfe9cf;--show:#fbefc4;--etc:#d9e8f2;--dim:#ecf3ea;--base:#e3f1e0}
:root[data-pal="sunset"]{--bg:#fdf7f2;--card:#ffffff;--ink:#3a2418;--mute:#7f604e;--line:#ecd9cc;--head:#f7dcc6;--accent:#b4470f;--onaccent:#ffffff;--sat:#1e63b5;--sun:#c4262e;--off:#ebe2dc;--plan:#dff0d4;--show:#ffe9b8;--etc:#e3e9f4;--dim:#f6ece4;--base:#fbe9d8}
:root[data-pal="contrast"]{--bg:#ffffff;--card:#ffffff;--ink:#000000;--mute:#333333;--line:#6b6b6b;--head:#111111;--accent:#ffd400;--onaccent:#000000;--sat:#0033cc;--sun:#b00020;--off:#bdbdbd;--plan:#9be09b;--show:#ffe066;--etc:#a9c8ff;--dim:#ececec;--base:#cfe3ff}
:root[data-pal="night"]{--bg:#0f1420;--card:#171e2e;--ink:#e8edf7;--mute:#98a4bd;--line:#2b3550;--head:#1f2b47;--accent:#7cc4ff;--onaccent:#07203a;--sat:#7fb0ff;--sun:#ff8f98;--off:#333b4d;--plan:#264a38;--show:#5a4a1f;--etc:#25405f;--dim:#131a29;--base:#1d2a44}
:root[data-pal="pink"]{--bg:#fff5f8;--card:#ffffff;--ink:#3d1f2b;--mute:#85596b;--line:#f1d3df;--head:#fbd5e3;--accent:#b3225f;--onaccent:#ffffff;--sat:#2563b8;--sun:#d0143c;--off:#efe3e8;--plan:#dcefd9;--show:#ffe8b5;--etc:#e0e4f6;--dim:#fbeaf0;--base:#fde4ee}
:root[data-pal="pastel"]{--bg:#faf8ff;--card:#ffffff;--ink:#2f2a45;--mute:#767190;--line:#e4def2;--head:#e5dcf7;--accent:#6a4fb0;--onaccent:#ffffff;--sat:#4a7fd0;--sun:#e0607a;--off:#e8e6ee;--plan:#d6f2e2;--show:#fff0cf;--etc:#d9ebfb;--dim:#f3f0fa;--base:#fde8dc}
select.pal{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-left:auto;cursor:pointer}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Pretendard","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--head);border-radius:12px;padding:10px 14px;margin-bottom:10px}
header h1{flex:1;min-width:120px;margin:0;font-size:20px;color:var(--accent);text-align:center}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.owner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 2px 8px;font-size:13px;color:var(--mute)}
.owner b{color:var(--ink);font-size:15px}
#bwrap{cursor:pointer;margin-left:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 2px 8px;font-size:13px}
.legend label{cursor:pointer}
.owner{flex-wrap:wrap;row-gap:6px}
.owner>*{white-space:nowrap;flex:0 0 auto}
.owner #oname{flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.owner #info{white-space:normal;flex:1 1 auto}
.viewbar{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;margin:0 2px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:13px;font-weight:400;cursor:pointer;user-select:none;position:relative}
.chip:hover{border-color:var(--accent)}
.chip input[type=checkbox]{position:absolute;opacity:0;width:0;height:0;margin:0}
.chip.on{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.chip select.pal{margin-left:0;border:0;background:transparent;color:inherit;font:inherit;padding:0 2px;cursor:pointer}
.viewbar #bwrap{margin-left:0}
.tgrid{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;margin:10px 0}
.tgrid input[type=color]{width:48px;height:30px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card);cursor:pointer}
#tnote{font-size:12px;color:var(--mute);margin:4px 0 0}
.chip.dis{opacity:.45;cursor:not-allowed}
.owner .chip{color:var(--ink);font-size:13px}
.owner .chip.on{color:var(--onaccent)}
.wide-toggle{cursor:pointer;margin-left:12px;font-size:13px;color:var(--mute)}
:root[data-wide="1"] .wrap{max-width:none}
:root[data-wide="1"] .cell{min-height:max(104px,calc((100vh - 280px) / var(--rows,6)))}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:644px}
.dow{padding:7px 0;text-align:center;font-weight:600;background:var(--dim);border-bottom:1px solid var(--line)}
.dow.sat,.n.sat{color:var(--sat)}.dow.sun,.n.sun{color:var(--sun)}
.cell{min-height:104px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--dim);cursor:default;opacity:.55}
.cell:not(.out):hover{background:var(--dim)}
.n{font-weight:700;font-size:13px}
.today .n{background:var(--accent);color:var(--onaccent);border-radius:10px;padding:0 7px;align-self:flex-start}
.cell.hasbase{background:var(--base)}
.base{font-size:11px;line-height:1.3;color:var(--mute);text-align:left;word-break:keep-all;overflow-wrap:anywhere}
.multi .ev.off{background:repeating-linear-gradient(135deg,var(--off) 0 6px,transparent 6px 12px),var(--off)}
.cell.rest,.cell.rest:hover{background:repeating-linear-gradient(135deg,var(--off) 0 8px,transparent 8px 16px),var(--off)}
.cell.rest .ev{background:transparent;font-weight:700}
.ev{border-radius:6px;padding:4px 6px;font-size:12.5px;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.ev.off{background:var(--off)}.ev.plan{background:var(--plan)}.ev.show{background:var(--show)}.ev.etc{background:var(--etc)}
.status{margin:8px 2px;color:var(--mute);font-size:12px}
.sub{font-size:12px;color:var(--mute);margin:10px 0 6px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--mute);margin-bottom:10px}
body.dragging .drop{border-color:var(--accent);color:var(--accent)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.box h2{margin:0 0 6px;font-size:17px}
.item{padding:6px 2px;border-bottom:1px solid var(--line)}
.acts{display:flex;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="prev" aria-label="이전 달">‹</button>
    <h1 id="title"></h1>
    <button id="next" aria-label="다음 달">›</button>
    <select id="msel" title="데이터가 있는 월로 이동" style="display:none"></select>
    <button id="today">오늘</button>
    <button id="open" class="pri">백업 파일 열기</button>
    <input type="file" id="fi" accept=".json,application/json" multiple hidden>
  </header>
  <div class="drop" id="drop">백업 JSON 파일(<code>calendar-backup-*.json</code>, <code>calendar-expired-*.json</code>)을 여기로 끌어다 놓거나 위의 <b>백업 파일 열기</b>를 눌러 주세요. 다른 사람의 백업을 함께 열면 캘린더를 겹쳐서 보여요. 파일은 이 컴퓨터 안에서만 읽고 어디로도 전송하지 않아요.</div>
  <div class="owner"><span id="info"></span><button id="reset" style="display:none">비우기</button></div>
  <div class="legend" id="legend"></div>
  <div class="viewbar" id="viewbar">
    <label class="chip" title="색상 테마">🎨 <select class="pal" id="pal" title="색상 테마" aria-label="색상 테마"><option value="">기본(자동)</option><option value="pink">핑크</option><option value="pastel">파스텔</option><option value="ocean">바다</option><option value="forest">숲</option><option value="sunset">석양</option><option value="contrast">고대비</option><option value="night">야간</option><option value="custom">✏️ 내 테마</option></select></label>
    <button type="button" class="chip" id="themeEdit" title="내 테마 만들기·편집">✏️ 내 테마 편집</button>
    <label class="chip" id="widechip" title="화면 너비에 맞춰 넓게 보기"><input type="checkbox" id="wide">↔ 전체 너비</label>
    <label class="chip" id="bwrap" title="출시 일정을 날짜 칸에 함께 표시"><input type="checkbox" id="sbase">🎮 출시일 표시</label>
  </div>
  <div class="scroll"><div class="grid" id="grid"></div></div>
  <div class="status" id="status"></div>
</div>
<div class="modal" id="modal"><div class="box">
  <h2 id="mtitle"></h2>
  <div id="bsec"></div>
  <div id="psec"></div>
  <div class="acts"><button id="close">닫기</button></div>
</div></div>
<div class="modal" id="tmodal"><div class="box">
  <h2>내 테마 만들기</h2>
  <div class="sub" id="tinfo">색을 고르면 바로 적용되고, 이 브라우저에 저장돼요.</div>
  <div class="tgrid" id="tgrid"></div>
  <div id="tnote"></div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><button id="texport" type="button">⬇ 테마 내려받기</button><button id="timport" type="button">⬆ 테마 불러오기</button><input type="file" id="tfile" accept=".json,application/json" hidden></div>
  <div class="acts"><button id="treset">기본 색으로</button><button id="tclose" class="pri">완료</button></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const DOW=["월","화","수","목","금","토","일"];
const BICON={game:"🎮",event:"🎉",gear:"🖥️"};
const PALETTE=["#5b3fa0","#d9484f","#2f9e6e","#e08a1e","#2f6fd0","#c2449b","#6b7a8c","#0e9aa7"];
const kind=(t,c)=>/휴식|휴방/.test(t)?"off":(c==="off"||c==="show"?"plan":(c||"plan"));
const now=new Date();
let y=now.getFullYear(),m=now.getMonth(),base={},sources=[],files=[],showBase=true;
const mkey=()=>y+"-"+pad(m+1);
const dkey=d=>mkey()+"-"+pad(d);

function merge(t,ev){
  for(const [d,list] of Object.entries(ev||{})){
    if(!Array.isArray(list))continue;
    const a=t[d]||(t[d]=[]);
    list.forEach(x=>{
      if(!x||typeof x.t!=="string")return;
      if(!a.some(z=>(z.id&&z.id===x.id)||(!x.id&&z.t===x.t&&z.c===x.c)))a.push(x);
    });
  }
}
/* 같은 사용자(uid)의 파일은 한 캘린더로 합치고, 다른 사용자의 파일은 별도 캘린더로 겹쳐서 보여줘요.
   출시 일정(base)은 모두에게 공통이라 중복 없이 한 번만 보여줘요. */
function ingest(obj,fname){
  let n=0;
  if(!obj||typeof obj!=="object")return 0;
  if(obj.months||Array.isArray(obj.expired)){
    const key=obj.uid||fname;
    let src=sources.find(s=>s.key===key);
    if(!src){src={key,name:"",mine:{},on:true,color:PALETTE[sources.length%PALETTE.length]};sources.push(src)}
    if(obj.name)src.name=obj.name+"님";
    else if(!src.name)src.name=obj.uid?"사용자 "+obj.uid.slice(0,4):fname.replace(/\.json$/i,"");
    if(obj.months)for(const v of Object.values(obj.months)){merge(src.mine,v&&v.events);n++}
    if(Array.isArray(obj.expired))obj.expired.forEach(x=>{if(!x)return;merge(x.kind==="base"?base:src.mine,x.events);n++});
  }
  if(obj.base)for(const v of Object.values(obj.base)){merge(base,v&&v.events);n++}
  return n;
}
async function loadFiles(list){
  const errs=[];
  for(const f of list){
    try{
      const obj=JSON.parse(await f.text());
      if(!ingest(obj,f.name))throw new Error("일정 데이터가 없어요");
      files.push(f.name);
    }catch(e){errs.push(f.name+": "+(e.message||"읽을 수 없어요"))}
  }
  const ms=monthsWithData();
  if(ms.length){const last=ms[ms.length-1];y=+last.slice(0,4);m=+last.slice(5)-1}
  refresh();
  $("status").textContent=errs.length?"열지 못한 파일 — "+errs.join(" / "):"";
}
function monthsWithData(){
  const set=new Set();
  [base,...sources.map(s=>s.mine)].forEach(t=>Object.keys(t).forEach(d=>{if(t[d].length&&/^\d{4}-\d{2}-\d{2}$/.test(d))set.add(d.slice(0,7))}));
  return [...set].sort();
}
const count=t=>Object.values(t).reduce((a,l)=>a+l.length,0);
function refresh(){
  const ms=monthsWithData(),sel=$("msel");
  sel.innerHTML="";
  ms.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k.slice(0,4)+"년 "+(+k.slice(5))+"월";sel.appendChild(o)});
  sel.style.display=ms.length?"":"none";
  $("reset").style.display=files.length?"":"none";
  $("drop").style.display=files.length?"none":"";
  $("info").innerHTML=files.length
    ?"<b>캘린더 "+sources.length+"개</b> · 파일 "+files.length+"개 · 개인 일정 "+sources.reduce((a,s)=>a+count(s.mine),0)+"건 · 출시 일정 "+count(base)+"건 · 읽기 전용"
    :"불러온 백업이 없어요.";
  const lg=$("legend");lg.innerHTML="";
  sources.forEach(s=>{
    const l=document.createElement("label"),cb=document.createElement("input"),dot=document.createElement("span");
    cb.type="checkbox";cb.checked=s.on;cb.onchange=()=>{s.on=cb.checked;render()};
    dot.textContent="●";dot.style.color=s.color;
    l.append(cb," ",dot," "+s.name);lg.appendChild(l);
  });
  render();
}
function render(){
  $("title").textContent=y+"년 "+(m+1)+"월";
  const k=mkey(),sel=$("msel");
  if([...sel.options].some(o=>o.value===k))sel.value=k;else sel.selectedIndex=-1;
  const vis=sources.filter(s=>s.on),multi=sources.length>1;
  const g=$("grid");g.innerHTML="";g.classList.toggle("multi",multi);
  DOW.forEach((d,i)=>{const e=document.createElement("div");e.className="dow"+(i==5?" sat":i==6?" sun":"");e.textContent=d;g.appendChild(e)});
  const off=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
  const rows=Math.ceil((off+days)/7),t=new Date();
  g.style.setProperty("--rows",rows);
  for(let i=0;i<rows*7;i++){
    const c=document.createElement("div"),col=i%7,d=i-off+1;
    const n=document.createElement("div");n.className="n"+(col==5?" sat":col==6?" sun":"");
    if(d<1||d>days){c.className="cell out";n.textContent=d<1?prevDays+d:d-days;c.appendChild(n)}
    else{
      c.className="cell"+(t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d?" today":"");
      n.textContent=d;c.appendChild(n);
      const bl=showBase?(base[dkey(d)]||[]):[];
      if(bl.length){
        c.classList.add("hasbase");
        bl.forEach(x=>{const b=document.createElement("div");b.className="base";b.textContent=(BICON[x.c]||"")+" "+x.t;c.appendChild(b)});
      }
      vis.forEach(s=>(s.mine[dkey(d)]||[]).forEach(x=>{
        const e=document.createElement("div"),kd=kind(x.t,x.c);
        e.className="ev "+kd;e.textContent=x.t;
        if(multi){e.style.borderLeft="4px solid "+s.color;e.title=s.name}
        if(kd==="off"&&vis.length===1)c.classList.add("rest");
        c.appendChild(e);
      }));
      c.onclick=()=>openDay(d);
    }
    g.appendChild(c);
  }
}
function openDay(d){
  $("mtitle").textContent=y+"년 "+(m+1)+"월 "+d+"일";
  const b=base[dkey(d)]||[];
  const bs=$("bsec");bs.innerHTML="";
  if(b.length){
    const h=document.createElement("div");h.className="sub";h.textContent="출시 일정";bs.appendChild(h);
    b.forEach(x=>{const r=document.createElement("div");r.className="item";r.textContent=(BICON[x.c]||"")+" "+x.t;bs.appendChild(r)});
  }
  const ps=$("psec");ps.innerHTML="";
  let any=b.length>0;
  sources.filter(s=>s.on).forEach(s=>{
    const list=s.mine[dkey(d)]||[];
    if(!list.length)return;
    any=true;
    const h=document.createElement("div");h.className="sub";
    const dot=document.createElement("span");dot.textContent="●";dot.style.color=s.color;
    h.append(dot," "+s.name+"의 일정");ps.appendChild(h);
    list.forEach(x=>{const r=document.createElement("div");r.className="item";r.textContent=x.t;ps.appendChild(r)});
  });
  if(!any)ps.innerHTML='<div class="sub">이 날은 일정이 없어요.</div>';
  $("modal").classList.add("on");
}
function go(dm){m+=dm;if(m<0){m=11;y--}if(m>11){m=0;y++}render()}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("today").onclick=()=>{y=now.getFullYear();m=now.getMonth();render()};
$("msel").onchange=()=>{const k=$("msel").value;y=+k.slice(0,4);m=+k.slice(5)-1;render()};
$("open").onclick=()=>$("fi").click();
$("fi").onchange=async e=>{await loadFiles([...e.target.files]);e.target.value=""};
$("reset").onclick=()=>{base={};sources=[];files=[];$("status").textContent="";refresh()};
$("sbase").onchange=()=>{showBase=$("sbase").checked;render()};
$("close").onclick=()=>$("modal").classList.remove("on");
$("modal").onclick=e=>{if(e.target===$("modal"))$("modal").classList.remove("on")};
addEventListener("dragover",e=>{e.preventDefault();document.body.classList.add("dragging")});
addEventListener("dragleave",e=>{if(!e.relatedTarget)document.body.classList.remove("dragging")});
addEventListener("drop",async e=>{e.preventDefault();document.body.classList.remove("dragging");await loadFiles([...e.dataTransfer.files])});
(function(){
  const cb=document.getElementById("wide");
  cb.checked=document.documentElement.dataset.wide==="1";
  cb.onchange=()=>{
    if(cb.checked)document.documentElement.dataset.wide="1";else delete document.documentElement.dataset.wide;
    try{localStorage.setItem("wide",cb.checked?"1":"0")}catch(e){}
  };
})();
(function(){
  const root=document.documentElement,sel=document.getElementById("pal"),CT=window.CT;
  const setPal=v=>{
    if(v)root.dataset.pal=v;else delete root.dataset.pal;
    try{localStorage.setItem("pal",v)}catch(e){}
    sel.value=v;
  };
  sel.value=root.dataset.pal||"";
  sel.onchange=()=>{const v=sel.value;if(v==="custom")CT.apply(CT.load());setPal(v)};
  /* ---- 내 테마 편집기 ---- */
  /* '#fff', 'rgb(…)' 같은 표기도 '#rrggbb'로 바꿔요 */
  const toHex6=v=>{
    v=(v||"").trim().toLowerCase();
    if(/^#[0-9a-f]{6}$/.test(v))return v;
    if(/^#[0-9a-f]{3}$/.test(v))return "#"+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
    if(!v)return null;
    const t=document.createElement("span");t.style.color=v;document.body.appendChild(t);
    const c=getComputedStyle(t).color;t.remove();
    const m=c.match(/\d+/g);
    return m&&m.length>=3?"#"+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,"0")).join(""):null;
  };
  const grid=document.getElementById("tgrid"),note=document.getElementById("tnote"),modal=document.getElementById("tmodal");
  let cur=CT.load();
  const noteUpdate=()=>{
    const r=CT.contrast(cur.ink,cur.bg);
    note.textContent="글자와 배경의 대비 "+r.toFixed(1)+":1 "+(r>=4.5?"(읽기 좋아요)":"(낮아요. 글자나 배경 색을 조정해 보세요)");
  };
  const fill=()=>CT.FIELDS.forEach(([k])=>{document.getElementById("tc-"+k).value=cur[k]});
  const commit=()=>{CT.save(cur);CT.apply(cur);setPal("custom");noteUpdate()};
  CT.FIELDS.forEach(([k,label])=>{
    const l=document.createElement("label");l.textContent=label;l.htmlFor="tc-"+k;
    const i=document.createElement("input");i.type="color";i.id="tc-"+k;i.value=cur[k];
    i.oninput=()=>{cur[k]=i.value;commit()};
    grid.append(l,i);
  });
  document.getElementById("themeEdit").onclick=()=>{
    /* 저장해 둔 내 테마가 아니라, 지금 화면에 쓰이고 있는 테마의 색으로 편집 창을 열어요 */
    const cs=getComputedStyle(root);
    cur=CT.load();
    CT.FIELDS.forEach(([k])=>{const v=toHex6(cs.getPropertyValue("--"+k));if(v)cur[k]=v});
    let saved=false;try{saved=!!localStorage.getItem("customTheme")}catch(e){}
    document.getElementById("tinfo").textContent=(saved&&root.dataset.pal!=="custom")
      ?"지금 사용 중인 테마의 색에서 시작해요. 색을 바꾸면 저장해 둔 내 테마가 이 색으로 바뀌어요."
      :"지금 사용 중인 테마의 색에서 시작해요. 색을 고르면 바로 적용되고, 이 브라우저에 저장돼요.";
    fill();noteUpdate();   /* 열기만 해서는 테마를 바꾸거나 저장하지 않아요 */
    modal.classList.add("on");
  };
  /* ---- 테마 JSON 내려받기 / 불러오기 ---- */
  const tfile=document.getElementById("tfile");
  const download=(obj,name)=>{
    const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  document.getElementById("texport").onclick=()=>{
    download({type:"calendar-theme",version:1,exportedAt:new Date().toISOString(),colors:cur},"calendar-theme-"+new Date().toISOString().slice(0,10)+".json");
    note.textContent="테마 파일을 내려받았어요.";
  };
  document.getElementById("timport").onclick=()=>tfile.click();
  tfile.onchange=async e=>{
    const f=e.target.files[0];e.target.value="";
    if(!f)return;
    try{
      if(f.size>20000)throw new Error("파일이 너무 커요");
      let o;try{o=JSON.parse(await f.text())}catch(x){throw new Error("JSON 파일이 아니에요")}
      const src=o&&typeof o==="object"?(o.colors&&typeof o.colors==="object"?o.colors:o):null;
      if(!src)throw new Error("테마 파일이 아니에요");
      /* 올바른 #rrggbb 색만 받아서, 그 외 내용은 모두 무시해요 */
      const next=Object.assign({},cur);let n=0;
      CT.FIELDS.forEach(([k])=>{if(typeof src[k]==="string"&&CT.isHex(src[k])){next[k]=src[k].toLowerCase();n++}});
      if(!n)throw new Error("사용할 수 있는 색이 없어요");
      cur=next;fill();commit();
      note.textContent="불러왔어요 (색 "+n+"개 적용). "+note.textContent;
    }catch(err){note.textContent="불러오기 실패: "+(err.message||"알 수 없는 오류");}
  };
  document.getElementById("treset").onclick=()=>{cur=Object.assign({},CT.DEF);fill();commit()};
  const close=()=>modal.classList.remove("on");
  document.getElementById("tclose").onclick=close;
  modal.onclick=e=>{if(e.target===modal)close()};
})();
function syncChips(){
  document.querySelectorAll(".chip").forEach(l=>{
    const c=l.querySelector("input[type=checkbox]");
    if(!c)return;   /* 테마 선택·편집 버튼처럼 체크박스가 없는 칩은 건너뛰어요 */
    l.classList.toggle("on",c.checked);
    l.classList.toggle("dis",c.disabled);
  });
}
document.addEventListener("change",syncChips);
syncChips();
refresh();
</script>
