<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>try{var p=localStorage.getItem("pal");if(p)document.documentElement.dataset.pal=p}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공유 캘린더</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf9fc;--card:#fff;--ink:#26233a;--mute:#8a869b;--line:#e3e0ec;--head:#ddd4ea;--accent:#5b3fa0;
--sat:#2f6fd0;--sun:#d9484f;--off:#e2e1e6;--plan:#d8ecd8;--show:#fff0c8;--etc:#dbe8fb;--dim:#f1f0f5;--base:#e8f0fb;--onaccent:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151f;--card:#201e2b;--ink:#ece9f6;--mute:#9591a8;--line:#363349;--head:#3a3158;--accent:#b9a3f0;--sat:#7fa8f0;--sun:#f08a90;--off:#383643;--plan:#2f4a33;--show:#54492a;--etc:#2c3f5c;--dim:#1a1824;--base:#243049;--onaccent:#1a1030}}
:root[data-theme="dark"]{--bg:#17151f;--card:#201e2b;--ink:#ece9f6;--mute:#9591a8;--line:#363349;--head:#3a3158;--accent:#b9a3f0;--sat:#7fa8f0;--sun:#f08a90;--off:#383643;--plan:#2f4a33;--show:#54492a;--etc:#2c3f5c;--dim:#1a1824;--base:#243049;--onaccent:#1a1030}
:root[data-pal="ocean"]{--bg:#f3f8fb;--card:#ffffff;--ink:#10303f;--mute:#56707f;--line:#cfe0ea;--head:#cfe8f3;--accent:#0b5f8a;--onaccent:#ffffff;--sat:#1565c0;--sun:#c62828;--off:#dfe5e9;--plan:#d4efe3;--show:#fdeec2;--etc:#d6e6f7;--dim:#eaf2f7;--base:#e1f1fa}
:root[data-pal="forest"]{--bg:#f4f8f3;--card:#ffffff;--ink:#1b2e1f;--mute:#5a705f;--line:#d3e1d1;--head:#d6ead3;--accent:#2e6b34;--onaccent:#ffffff;--sat:#1d6fb8;--sun:#c0392b;--off:#e2e6df;--plan:#cfe9cf;--show:#fbefc4;--etc:#d9e8f2;--dim:#ecf3ea;--base:#e3f1e0}
:root[data-pal="sunset"]{--bg:#fdf7f2;--card:#ffffff;--ink:#3a2418;--mute:#7f604e;--line:#ecd9cc;--head:#f7dcc6;--accent:#b4470f;--onaccent:#ffffff;--sat:#1e63b5;--sun:#c4262e;--off:#ebe2dc;--plan:#dff0d4;--show:#ffe9b8;--etc:#e3e9f4;--dim:#f6ece4;--base:#fbe9d8}
:root[data-pal="contrast"]{--bg:#ffffff;--card:#ffffff;--ink:#000000;--mute:#333333;--line:#6b6b6b;--head:#111111;--accent:#ffd400;--onaccent:#000000;--sat:#0033cc;--sun:#b00020;--off:#bdbdbd;--plan:#9be09b;--show:#ffe066;--etc:#a9c8ff;--dim:#ececec;--base:#cfe3ff}
:root[data-pal="night"]{--bg:#0f1420;--card:#171e2e;--ink:#e8edf7;--mute:#98a4bd;--line:#2b3550;--head:#1f2b47;--accent:#7cc4ff;--onaccent:#07203a;--sat:#7fb0ff;--sun:#ff8f98;--off:#333b4d;--plan:#264a38;--show:#5a4a1f;--etc:#25405f;--dim:#131a29;--base:#1d2a44}
:root[data-pal="pink"]{--bg:#fff5f8;--card:#ffffff;--ink:#3d1f2b;--mute:#85596b;--line:#f1d3df;--head:#fbd5e3;--accent:#b3225f;--onaccent:#ffffff;--sat:#2563b8;--sun:#d0143c;--off:#efe3e8;--plan:#dcefd9;--show:#ffe8b5;--etc:#e0e4f6;--dim:#fbeaf0;--base:#fde4ee}
:root[data-pal="pastel"]{--bg:#faf8ff;--card:#ffffff;--ink:#2f2a45;--mute:#767190;--line:#e4def2;--head:#e5dcf7;--accent:#6a4fb0;--onaccent:#ffffff;--sat:#4a7fd0;--sun:#e0607a;--off:#e8e6ee;--plan:#d6f2e2;--show:#fff0cf;--etc:#d9ebfb;--dim:#f3f0fa;--base:#fde8dc}
select.pal{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-left:auto;cursor:pointer}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Pretendard","Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--head);border-radius:12px;padding:10px 14px;margin-bottom:10px}
header h1{flex:1;min-width:120px;margin:0;font-size:20px;color:var(--accent);text-align:center}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));min-width:644px}
.dow{padding:7px 0;text-align:center;font-weight:600;background:var(--dim);border-bottom:1px solid var(--line)}
.dow.sat,.n.sat{color:var(--sat)}.dow.sun,.n.sun{color:var(--sun)}
.cell{min-height:104px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--dim);cursor:default;opacity:.55}
.cell:not(.out):hover{background:var(--dim)}
.n{font-weight:700;font-size:13px}
.today .n{background:var(--accent);color:var(--onaccent);border-radius:10px;padding:0 7px;align-self:flex-start}
.cell.hasbase{background:var(--base)}
.base{font-size:11px;line-height:1.3;color:var(--mute);text-align:left;word-break:keep-all;overflow-wrap:anywhere}
.cell.rest,.cell.rest:hover{background:repeating-linear-gradient(135deg,var(--off) 0 8px,transparent 8px 16px),var(--off)}
.cell.rest .ev{background:transparent;font-weight:700}
.ev{border-radius:6px;padding:4px 6px;font-size:12.5px;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.ev.off{background:var(--off)}.ev.plan{background:var(--plan)}.ev.show{background:var(--show)}.ev.etc{background:var(--etc)}
.owner{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-weight:700;font-size:16px}
.owner label{font-weight:400;font-size:13px;color:var(--mute);cursor:pointer}
.sub{font-size:12px;color:var(--mute);margin:10px 0 6px;font-weight:600}
.menuwrap{position:relative;display:inline-block}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:5;min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px #0003}
.menu[hidden]{display:none}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px}
.menu button:hover{background:var(--dim)}
.menu .danger{color:var(--sun)}
.menu small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.status{margin:8px 2px;color:var(--mute);font-size:12px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.box{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:85vh;overflow:auto}
.box h2{margin:0 0 10px;font-size:17px}
.row{display:flex;gap:6px;margin-bottom:6px}
.row input,.row select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.row input{flex:1;min-width:0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="prev" aria-label="이전 달">‹</button>
    <h1 id="title"></h1>
    <button id="next" aria-label="다음 달">›</button>
    <button id="today">오늘</button>
    <button id="find">캘린더 찾기</button>
    <button id="login">로그인</button>
    <button id="link" style="display:none">링크 복사</button>
    <button id="mine" style="display:none">내 캘린더</button>
  </header>
  <div class="owner"><span id="oname"></span><button id="rename" style="display:none">이름 설정</button>
    <span class="menuwrap" id="bkwrap" style="display:none">
      <button id="bkbtn" aria-haspopup="true" aria-expanded="false">더보기 ▾</button>
      <div class="menu" id="bkmenu" hidden>
        <button id="export">⬇ 일정 내려받기<small>내 일정을 JSON 파일로 저장해요</small></button>
        <button id="restore">⬆ 백업에서 복구<small>JSON 파일의 일정을 합쳐 넣어요</small></button>
        <hr id="leavehr" style="display:none;border:0;border-top:1px solid var(--line);margin:4px 0">
        <button id="leave" class="danger" style="display:none">🚪 탈퇴하기<small>내 일정·이름을 삭제하고 가입을 취소해요</small></button>
      </div>
    </span>
    <input type="file" id="rfile" accept=".json,application/json" hidden>
    <button id="adm" style="display:none">사용자 관리</button>
    <label id="lwrap" style="display:none"><input type="checkbox" id="listed"> 다른 사람이 찾을 수 있게 노출</label>
    <select class="pal" id="pal" title="색상 테마" aria-label="색상 테마"><option value="">기본(자동)</option><option value="pink">핑크</option><option value="pastel">파스텔</option><option value="ocean">바다</option><option value="forest">숲</option><option value="sunset">석양</option><option value="contrast">고대비</option><option value="night">야간</option></select>
    <label id="bwrap" style="margin-left:12px"><input type="checkbox" id="sbase"> 출시일 표시</label></div>
  <div class="scroll"><div class="grid" id="grid"></div></div>
  <div class="status" id="status"></div>
  <div class="status" style="text-align:right;opacity:.7">버전: 출시일정 줄 표시 (v19)</div>
</div>
<div class="modal" id="modal"><div class="box">
  <h2 id="mtitle"></h2>
  <div id="bsec"></div>
  <div class="sub" id="psub">내 일정</div>
  <div id="rows"></div>
  <button id="add">+ 일정 추가</button>
  <div class="acts"><button id="cancel">닫기</button><button class="pri" id="save">저장</button></div>
</div></div>
<div class="modal" id="fmodal"><div class="box">
  <h2>공유 캘린더 찾기</h2>
  <div class="row"><input id="fq" placeholder="이름 검색 (비워 두면 전체)"><button id="fgo">검색</button></div>
  <div id="fres"></div>
  <div class="acts"><button id="fclose">닫기</button></div>
</div></div>
<div class="modal" id="amodal"><div class="box">
  <h2>사용자 관리</h2>
  <div id="astat" class="sub"></div>
  <div class="row"><input id="amax" type="number" min="1" max="1000" style="max-width:110px"><button id="amaxsave" class="pri">최대 인원 저장</button></div>
  <div class="sub">가입한 사용자</div>
  <div id="alist"></div>
  <div class="sub">사용 제한된 계정</div>
  <div id="ablock"></div>
  <div class="sub">관리자</div>
  <div id="aadmins"></div>
  <div class="row" id="aaddrow" style="display:none"><input id="auid" placeholder="추가할 사용자의 UID"><button id="aadd">추가</button></div>
  <div class="acts"><button id="aclose">닫기</button></div>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc,collection,query,where,limit,getDocs,getDoc,deleteDoc,runTransaction,serverTimestamp,writeBatch,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,deleteUser,reauthenticateWithPopup} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* Firebase 설정은 같은 폴더의 firebase-config.js에서 불러와요 */
let firebaseConfig={apiKey:"YOUR_API_KEY"},configError="";
try{
  const mod=await import("./firebase-config.js");
  if(mod.firebaseConfig)firebaseConfig=mod.firebaseConfig;
}catch(e){configError="firebase-config.js를 불러오지 못했어요"}

const TYPES={off:"휴방",plan:"일정",show:"공연·극장",etc:"기타"};
const DOW=["월","화","수","목","금","토","일"];
const configured=!String(firebaseConfig.apiKey||"YOUR_").startsWith("YOUR_");
let db=null,auth=null,user=null,cleaned=false,member=false,joinMsg="",myRole="",pUnsub=null,pname="",plisted=false,bUnsub=null,baseWork=[],baseData={},showBase=true,unsub=null,y,m,data={},editing=null,work=[];
const now=new Date();y=now.getFullYear();m=now.getMonth();
const $=id=>document.getElementById(id);
const kind=(t,c)=>/휴식|휴방/.test(t)?"off":(c==="off"||c==="show"?"plan":(c||"plan"));
const DEFAULT_MAX=20; // 관리자가 바꾸기 전 기본 최대 가입 인원(관리자 제외)
const isAdmin=()=>myRole==="owner"||myRole==="admin";
const isOwnerUser=()=>myRole==="owner";
const BTYPES={game:"게임",event:"이벤트",gear:"장비"};
const BICON={game:"🎮",event:"🎉",gear:"🖥️"};
const expTs=()=>Timestamp.fromDate(new Date(y+EXP_YEARS,m+1,1)); // 해당 월이 끝나고 6년 뒤 만료
const rid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const mkey=()=>y+"-"+pad(m+1);
const dkey=d=>mkey()+"-"+pad(d);
const viewUid=new URLSearchParams(location.search).get("u");
const target=()=>viewUid||(user&&user.uid)||null;
const active=()=>!!user&&member;
const canWrite=()=>!configured||(active()&&target()===user.uid);

if(configured){
  const app=initializeApp(firebaseConfig);
  db=getFirestore(app);auth=getAuth(app);
  onAuthStateChanged(auth,async u=>{user=u;member=false;joinMsg="";myRole="";$("login").textContent=u?"로그아웃":"로그인";if(!u)cleaned=false;if(u)await loadMe();updateBtns();subscribe();subProfile();cleanup()});
}else{$("login").style.display="none";$("find").style.display="none";$("bwrap").style.display="none"}

function updateBtns(){
  $("link").style.display=active()?"":"none";
  $("adm").style.display=isAdmin()?"":"none";
  $("mine").style.display=(user&&viewUid&&viewUid!==user.uid)?"":"none";
}
function subProfile(){
  if(pUnsub){pUnsub();pUnsub=null}
  pname="";plisted=false;
  const t=target();
  if(!db||!t){renderOwner();return}
  pUnsub=onSnapshot(doc(db,"users",t),s=>{pname=(s.exists()&&s.data().name)||"";plisted=!!(s.exists()&&s.data().listed);renderOwner()},()=>renderOwner());
}
function renderOwner(){
  const t=target(),mine=active()&&t===user.uid;
  $("oname").textContent=!t?"":(pname?pname+"님의 캘린더":(mine?"표시할 이름을 설정해 주세요":"이름 없는 캘린더"));
  $("rename").style.display=mine?"":"none";
  $("rename").textContent=pname?"이름 변경":"이름 설정";
  $("lwrap").style.display=mine?"":"none";
  $("bkwrap").style.display=mine?"":"none";
  const canLeave=mine&&member&&!isAdmin();
  $("leave").style.display=$("leavehr").style.display=canLeave?"":"none";
  $("listed").checked=plisted;
}
function setStatus(t){$("status").textContent=t}
function subBase(){
  if(bUnsub){bUnsub();bUnsub=null}
  baseData={};
  if(!db)return;
  bUnsub=onSnapshot(doc(db,"base",mkey()),s=>{baseData=(s.exists()&&s.data().events)||{};render()},()=>{});
}
function subscribe(){
  subBase();
  if(unsub){unsub();unsub=null}
  data={};
  const t=target();
  if(!db||!t){render();return}
  unsub=onSnapshot(doc(db,"users",t,"months",mkey()),
    s=>{data=(s.exists()&&s.data().events)||{};render()},
    e=>setStatus("불러오기 실패: "+e.code));
}
function render(){
  renderOwner();
  $("title").textContent=y+"년 "+(m+1)+"월";
  const g=$("grid");g.innerHTML="";
  DOW.forEach((d,i)=>{const e=document.createElement("div");e.className="dow"+(i==5?" sat":i==6?" sun":"");e.textContent=d;g.appendChild(e)});
  const off=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();
  const rows=Math.ceil((off+days)/7),t=new Date();
  for(let i=0;i<rows*7;i++){
    const c=document.createElement("div"),col=i%7,d=i-off+1;
    const n=document.createElement("div");n.className="n"+(col==5?" sat":col==6?" sun":"");
    if(d<1||d>days){c.className="cell out";n.textContent=d<1?prevDays+d:d-days;c.appendChild(n)}
    else{
      c.className="cell"+(t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d?" today":"");
      n.textContent=d;c.appendChild(n);
      const bl=showBase?(baseData[dkey(d)]||[]):[];
      if(bl.length){
        c.classList.add("hasbase");
        bl.forEach(x=>{
          const b=document.createElement("div");b.className="base";
          b.textContent=(BICON[x.c]||"")+" "+x.t;
          c.appendChild(b);
        });
      }
      (data[dkey(d)]||[]).forEach(ev=>{const e=document.createElement("div");const k=kind(ev.t,ev.c);e.className="ev "+k;if(k==="off")c.classList.add("rest");e.textContent=ev.t;c.appendChild(e)});
      c.onclick=()=>openDay(d);
    }
    g.appendChild(c);
  }
  if(!configured)setStatus(configError?configError+" — index.html과 같은 폴더에 firebase-config.js가 있는지, 웹 서버(호스팅)로 열었는지 확인해 주세요.":"Firebase 설정 전이라 저장되지 않는 미리보기 상태입니다.");
  else if(!target())setStatus("로그인하면 나만의 캘린더가 만들어져요. 링크를 받았다면 그 링크로 접속하세요.");
  else if(user&&!active()&&target()===user.uid)setStatus(joinMsg||"가입 확인 중...");
  else if(!canWrite())setStatus("다른 사람의 캘린더입니다. (보기 전용)");
  else setStatus("날짜를 눌러 일정을 추가·수정하고, '링크 복사'로 공유하세요.");
}
function openDay(d){
  editing=d;work=(data[dkey(d)]||[]).map(x=>({...x}));
  $("mtitle").textContent=y+"년 "+(m+1)+"월 "+d+"일";
  drawRows();
  baseWork=(baseData[dkey(d)]||[]).map(x=>({...x}));
  drawBase();
  $("add").style.display=canWrite()?"":"none";
  $("save").style.display=(canWrite()||isAdmin())?"":"none";
  $("modal").classList.add("on");
}
function drawBase(){
  const box=$("bsec");box.innerHTML="";
  const adm=isAdmin();
  if(!baseWork.length&&!adm){$("psub").style.display="none";return}
  $("psub").style.display="";
  const h=document.createElement("div");h.className="sub";h.textContent="출시 일정";box.appendChild(h);
  baseWork.forEach((ev,i)=>{
    const row=document.createElement("div");row.className="row";
    if(!adm){
      const t=document.createElement("div");t.textContent=(BICON[ev.c]||"")+" "+ev.t;t.style.padding="4px 2px";row.appendChild(t);
    }else{
      const sel=document.createElement("select");
      Object.entries(BTYPES).forEach(([k,v])=>{const o=document.createElement("option");o.value=k;o.textContent=v;if(k==ev.c)o.selected=true;sel.appendChild(o)});
      sel.onchange=()=>ev.c=sel.value;
      const inp=document.createElement("input");inp.value=ev.t;inp.placeholder="출시 일정 내용";inp.oninput=()=>ev.t=inp.value;
      const x=document.createElement("button");x.textContent="✕";x.setAttribute("aria-label","삭제");x.onclick=()=>{baseWork.splice(i,1);drawBase()};
      row.append(sel,inp,x);
    }
    box.appendChild(row);
  });
  if(adm){const a=document.createElement("button");a.textContent="+ 출시 일정 추가";a.onclick=()=>{baseWork.push({id:rid(),t:"",c:"game"});drawBase()};box.appendChild(a)}
}
function drawRows(){
  const r=$("rows");r.innerHTML="";
  if(!work.length){const p=document.createElement("div");p.className="status";p.textContent="일정이 없습니다.";r.appendChild(p)}

/* ---------- 백업 JSON에서 복구 ---------- */
const MK=/^\d{4}-\d{2}$/;
const expFor=id=>Timestamp.fromDate(new Date(+id.slice(0,4)+EXP_YEARS,+id.slice(5,7),1));
function cleanEvents(mk,ev,isBase){
  const out={};let n=0;
  for(const [d,list] of Object.entries(ev||{})){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d.slice(0,7)!==mk||!Array.isArray(list))continue;
    const a=[];
    list.forEach(x=>{
      if(!x||typeof x.t!=="string"||!x.t.trim())return;
      const t=x.t.trim().slice(0,200);
      a.push({id:(typeof x.id==="string"&&x.id)?x.id.slice(0,20):rid(),t,c:isBase?(BTYPES[x.c]?x.c:"event"):kind(t,x.c)});
    });
    if(a.length){out[d]=a;n+=a.length}
  }
  return {out,n};
}
function mergeInto(dst,src){
  for(const [d,list] of Object.entries(src)){
    const a=dst[d]||(dst[d]=[]);
    list.forEach(x=>{if(!a.some(z=>(z.id&&z.id===x.id)||(z.t===x.t&&z.c===x.c)))a.push(x)});
  }
}
function planFromBackup(obj){
  const personal={},baseP={};
  const add=(target,mk,ev,isBase)=>{
    if(!MK.test(mk))return;
    const {out,n}=cleanEvents(mk,ev,isBase);
    if(n)mergeInto(target[mk]||(target[mk]={}),out);
  };
  if(obj&&obj.months&&typeof obj.months==="object")for(const [mk,v] of Object.entries(obj.months))add(personal,mk,v&&v.events,false);
  if(obj&&Array.isArray(obj.expired))obj.expired.forEach(x=>{if(!x)return;if(x.kind==="base")add(baseP,x.id,x.events,true);else add(personal,x.id,x.events,false)});
  if(obj&&obj.base&&typeof obj.base==="object")for(const [mk,v] of Object.entries(obj.base))add(baseP,mk,v&&v.events,true);
  return {personal,baseP};
}
const cnt=p=>Object.values(p).reduce((a,mo)=>a+Object.values(mo).reduce((b,l)=>b+l.length,0),0);
async function restoreInto(colPath,plan,docPath){
  const cur={};
  const snap=await getDocs(collection(db,...colPath));
  snap.forEach(d=>{cur[d.id]=d.data().events||{}});
  let done=0;
  for(const [mk,add] of Object.entries(plan)){
    const merged=cur[mk]?JSON.parse(JSON.stringify(cur[mk])):{};
    mergeInto(merged,add);
    await setDoc(doc(db,...colPath,mk),{events:merged,expireAt:expFor(mk)});
    done++;
  }
  return done;
}

async function loadMe(){
  myRole="";member=false;joinMsg="";
  if(!db||!user)return;
  const mRef=doc(db,"members",user.uid),oRef=doc(db,"config","owner");
  try{
    const m=await getDoc(mRef);
    if(m.exists()){
      member=true;myRole=m.data().role||"member";
      if(myRole==="member"){
        const o=await getDoc(oRef);
        if(o.exists()&&o.data().uid===user.uid){await setDoc(mRef,{role:"owner"},{merge:true});myRole="owner"}
      }
      return;
    }
    const o=await getDoc(oRef);
    if(o.exists()){
      if(o.data().uid===user.uid){await setDoc(mRef,{joinedAt:serverTimestamp(),role:"owner"});member=true;myRole="owner";return}
      await joinMember();return;
    }
    if(confirm("아직 이 캘린더의 소유자(관리자)가 등록되어 있지 않아요.\n이 계정을 소유자로 등록할까요?\n\n※ 사이트를 만든 본인만 '확인'을 눌러 주세요. 한 번 등록하면 다른 사람은 등록할 수 없어요.")){
      const b=writeBatch(db);
      b.set(oRef,{uid:user.uid,at:serverTimestamp()});
      b.set(mRef,{joinedAt:serverTimestamp(),role:"owner"});
      await b.commit();
      member=true;myRole="owner";return;
    }
    await joinMember();
  }catch(e){joinMsg="가입 확인 실패: "+(e.code||"오류")}
}
async function joinMember(){
  const sRef=doc(db,"config","settings"),cRef=doc(db,"config","stats"),mRef=doc(db,"members",user.uid),bRef=doc(db,"blocked",user.uid);
  try{
    await runTransaction(db,async tx=>{
      const [s,c,b]=await Promise.all([tx.get(sRef),tx.get(cRef),tx.get(bRef)]);
      if(b.exists())throw {code:"blocked"};
      const max=s.exists()?s.data().maxUsers:DEFAULT_MAX;
      const cnt=c.exists()?c.data().count:0;
      if(cnt>=max)throw {code:"full"};
      tx.set(mRef,{joinedAt:serverTimestamp()});
      tx.set(cRef,{count:cnt+1});
    });
    member=true;myRole="member";
  }catch(e){
    if(e.code==="blocked")joinMsg="사용이 제한된 계정이에요. 지금은 다른 사람의 캘린더를 보기만 할 수 있어요.";
    else if(e.code==="full"||e.code==="permission-denied")joinMsg="가입 가능 인원이 가득 찼어요. 지금은 다른 사람의 캘린더를 보기만 할 수 있어요. 관리자에게 문의해 주세요.";
    else joinMsg="가입 처리 실패: "+(e.code||"오류");
  }
}

  try{await setDoc(doc(db,"config","settings"),{maxUsers:n});await loadAdmin();$("astat").textContent+=" · 저장했어요 (이미 가입한 사용자는 유지되고, 새 가입만 제한돼요)"}
  catch(e){$("astat").textContent="저장 실패: "+(e.code||"오류")}
};
/* ---------- 탈퇴 ---------- */
async function leave(){
  if(!db||!user||!member||isAdmin())return;
  if(!confirm("탈퇴하면 내 일정과 이름이 모두 삭제되고 되돌릴 수 없어요.\n삭제하기 전에 백업 파일을 먼저 내려받아요.\n\n계속할까요?"))return;
  if(prompt("확인을 위해 '탈퇴'를 입력해 주세요.")!=="탈퇴")return;
  try{
    setStatus("탈퇴 처리 중...");
    const uid=user.uid;
    const snap=await getDocs(collection(db,"users",uid,"months"));
    const out={exportedAt:new Date().toISOString(),uid,name:pname,months:{}};
    snap.forEach(d=>{const x=d.data();out.months[d.id]={events:x.events||{},expireAt:iso(x.expireAt)}});
    saveJson(out,"calendar-withdraw-backup-");
    for(const d of snap.docs)await deleteDoc(d.ref);
    await deleteDoc(doc(db,"users",uid));
    await runTransaction(db,async tx=>{
      const cRef=doc(db,"config","stats");
      const c=await tx.get(cRef);
      tx.delete(doc(db,"members",uid));
      tx.set(cRef,{count:Math.max(0,(c.exists()?c.data().count:1)-1)});
    });
    member=false;
    let removed=false;
    try{await deleteUser(auth.currentUser);removed=true}
    catch(e){
      if(e.code==="auth/requires-recent-login"){
        try{await reauthenticateWithPopup(auth.currentUser,new GoogleAuthProvider());await deleteUser(auth.currentUser);removed=true}catch(e2){}
      }
    }
    if(!removed)await signOut(auth);
    alert("탈퇴가 완료됐어요. 내려받은 백업 파일은 잘 보관해 주세요."+(removed?"":"\n(로그인 계정 자체는 남아 있어요. 필요하면 구글 계정 설정에서 이 앱의 연결을 해제해 주세요.)"));
  }catch(e){setStatus("탈퇴 실패: "+(e.code||e.message||"오류")+" — 일부만 삭제됐을 수 있어요. 다시 시도해 주세요.")}
}
$("leave").onclick=leave;
function go(dm){m+=dm;if(m<0){m=11;y--}if(m>11){m=0;y++}subscribe()}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("today").onclick=()=>{y=now.getFullYear();m=now.getMonth();subscribe()};
try{showBase=localStorage.getItem("showBase")!=="0"}catch(e){}
$("sbase").checked=showBase;
$("sbase").onchange=()=>{showBase=$("sbase").checked;try{localStorage.setItem("showBase",showBase?"1":"0")}catch(e){}render()};
(function(){
  const sel=document.getElementById("pal");
  sel.value=document.documentElement.dataset.pal||"";
  sel.onchange=()=>{
    const v=sel.value;
    if(v)document.documentElement.dataset.pal=v;else delete document.documentElement.dataset.pal;
    try{localStorage.setItem("pal",v)}catch(e){}
  };
})();
render();subscribe();subProfile();
</script>
