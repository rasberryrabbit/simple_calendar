# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 👇 특정 확장자만 복사 (필요에 따라 확장자 추가/삭제)
      - name: Filter files by extension
        run: |
          mkdir -p filtered-deploy
          find . -type f \( \
            -name "*.html"  -o \
            -name "*.js"    -o \
            -name "*.css"   -o \
            -name "*.json"  -o \
            -name "*.svg"   -o \
            -name "*.png"   -o \
            -name "*.jpg"   -o \
            -name "*.ico"   -o \
            -name "*.woff"  -o \
            -name "*.woff2" \
          \) \
            ! -path "*/.git/*" \
            ! -path "*/.github/*" \
            ! -path "*/node_modules/*" \
            ! -path "./filtered-deploy/*" \
            -exec cp --parents {} filtered-deploy/ \;

      # 👇 배포 전 검증 (index.html이 루트에 있는지 확인)
      - name: Verify artifact
        run: |
          echo "=== filtered-deploy 내용 ==="
          find filtered-deploy -type f | head -50
          if [ ! -f filtered-deploy/index.html ]; then
            echo "::error::filtered-deploy/index.html 이 없습니다."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './filtered-deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
